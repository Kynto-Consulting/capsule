# Compuerta: vet + pruebas (Go). Imagen fijada; checkout fijado por SHA.
name: ci-go
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ci
    container:
      image: golang:1.25.3-bookworm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: vet
        run: go vet ./...
      - name: Pruebas
        run: go test ./... -count=1
