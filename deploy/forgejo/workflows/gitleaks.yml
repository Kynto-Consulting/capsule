# Compuerta: secretos (gitleaks). Sustituye a GitHub secret scanning / push protection.
# Imagen fijada por tag (verifica que existe; para endurecer fija por digest: image@sha256:...).
name: gitleaks
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ci
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1
    steps:
      # El contenedor no tiene node, asi que no se usa actions/checkout: clon manual con el token del job.
      - name: Checkout (historial completo)
        env:
          TOKEN: ${{ github.token }}
        run: |
          command -v git >/dev/null || apk add --no-cache git
          git config --global --add safe.directory '*'
          host="${GITHUB_SERVER_URL#https://}"
          git clone --no-tags "https://ci:${TOKEN}@${host}/${GITHUB_REPOSITORY}.git" .
          git checkout --force "$GITHUB_SHA"
      - name: Escaneo de secretos
        run: gitleaks git --redact --verbose --exit-code 1 .
