# Compuerta: trivy sobre el sistema de archivos (dependencias, secretos, IaC) y sobre la imagen del Dockerfile.
# La imagen se construye con kaniko: NO hay docker.sock en los jobs (ver README, "Construir imagenes sin socket").
name: trivy
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  filesystem:
    runs-on: ci
    container:
      image: aquasec/trivy:0.76.1
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          command -v git >/dev/null || apk add --no-cache git
          host="${GITHUB_SERVER_URL#https://}"
          git init -q .
          git fetch -q --depth=1 --no-tags "https://ci:${TOKEN}@${host}/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --force FETCH_HEAD
      - run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .
  image:
    # Solo tiene efecto si el repo trae Dockerfile en la raiz. kaniko-debug no trae git ni curl, y el wget de busybox
    # no negocia TLS con git.tumi-ai.com (alert 47): el contexto se descarga con el cliente git de kaniko (Go).
    runs-on: ci
    container:
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
    steps:
      - name: Construir sin push (tar)
        env:
          GIT_USERNAME: ci
          GIT_PASSWORD: ${{ github.token }}
        run: |
          mkdir -p /tmp
          host="${GITHUB_SERVER_URL#https://}"
          if ! /kaniko/executor --context "git://${host}/${GITHUB_REPOSITORY}.git#${GITHUB_REF}#${GITHUB_SHA}"               --dockerfile Dockerfile --no-push --tar-path /tmp/image.tar > /tmp/kaniko.log 2>&1; then
            cat /tmp/kaniko.log
            grep -qi "Dockerfile: no such file" /tmp/kaniko.log && { echo "sin Dockerfile, nada que escanear"; exit 0; }
            exit 1
          fi
          tail -n 5 /tmp/kaniko.log
      - name: Trivy sobre la imagen (binario con checksum)
        env:
          TRIVY_VERSION: "0.76.1"
          TRIVY_SHA256: ${{ vars.TRIVY_LINUX64_SHA256 }}   # sha256 del tar.gz de trivy; definelo en Variables de la organizacion
        run: |
          test -f /tmp/image.tar || exit 0
          : "${TRIVY_SHA256:?define la variable TRIVY_LINUX64_SHA256}"
          wget -qO /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          /tmp/trivy image --input /tmp/image.tar --severity HIGH,CRITICAL --exit-code 1
