# Reglas propias: React.
rules:
  - id: tumi-react-dangerously-set-inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      dangerouslySetInnerHTML con contenido no literal: riesgo de XSS. Sanitiza con DOMPurify.sanitize() (lista de
      etiquetas permitidas) o renderiza como texto/Markdown seguro.
    metadata: {category: security, cwe: "CWE-79", owasp: "A03:2021 Injection"}
    patterns:
      - pattern: '<$EL dangerouslySetInnerHTML={{__html: $X}} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: "..."}} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: DOMPurify.sanitize(...)}} />'
