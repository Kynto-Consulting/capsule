    X-Capsule-Delivery: UUID de entrega
    X-Capsule-Timestamp: unix segundos
    X-Capsule-Signature: sha256=<hex(HMAC-SHA256(secret, timestamp + '.' + cuerpo_crudo))>
  verification: El receptor recalcula con el secreto, compara en tiempo constante y rechaza si |now-timestamp| > 300 s. Durante 24 h tras una
    rotacion se envia ademas X-Capsule-Signature-Previous.
  delivery: 'Reintentos con backoff 10 s, 1 min, 5 min, 30 min, 2 h, 6 h (6 intentos); 2xx = entregado; 410 desactiva el webhook. Orden no garantizado:
    usa created_at e id. Destinos pasan por la politica anti-SSRF de gitsource/ssrf.go.'
  slack_discord: kind=slack|discord envian un mensaje formateado (no el sobre firmado) a la URL entrante del canal; la URL se guarda cifrada.
webhooks:
  capsuleEvent:
    post:
      summary: Entrega saliente de Capsule al receptor del cliente
      operationId: capsuleEventDelivery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEnvelope'
      responses:
        2XX:
          description: Entregado
        '410':
          description: Desactiva el webhook
