# Generado a partir del plan de Git Capsule; editar directamente este archivo a partir de ahora.
openapi: 3.1.0
info:
  title: Git Capsule API
  version: 0.1.0
  description: 'Fuente de verdad de la API de Git Capsule. Las rutas con `x-status: implemented` existen en backend/internal/server/router.go;
    `in-progress` las estan construyendo otros agentes (migracion 000030 y CLI) y su forma exacta debe confirmarse al aterrizar; `new` son de
    este plan. Convenciones: identificadores de org/proyecto son UUID (`{orgID}`, `{projectID}`, como en el router actual); los CLI aceptan slugs/ids
    cortos y los resuelven. Errores: ver `Error`. Paginacion por cursor (`cursor`, `limit`). Idempotencia: operaciones con `x-idempotent: true`
    aceptan cabecera `Idempotency-Key` (24 h).'
  license:
    name: Interna
servers:
- url: https://api.tumi-ai.com/api/v1
  description: Produccion
- url: http://localhost:8080/api/v1
security:
- bearerAuth: []
tags:
- name: Plataforma
- name: Webhooks entrantes
- name: Git
- name: Previews
- name: Codigo
- name: Ramas
- name: Commits
- name: Proteccion
- name: Pull requests
- name: Actions
- name: Entornos
- name: Aprobaciones
- name: Seguridad
- name: Webhooks salientes
- name: Actividad
- name: Auditoria
- name: Miembros
- name: Importacion
- name: Recuperacion
- name: Acceso Git
