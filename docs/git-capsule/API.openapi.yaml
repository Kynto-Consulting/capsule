  /orgs/{orgID}/git/imports:
    post:
      operationId: importCreate
      summary: Importa repos desde GitHub (token efimero, no se guarda)
      description: |
        El token solo vive en la memoria de la peticion en curso: no se guarda, no se registra y se
        elimina de todo mensaje de error. Cada repo tiene su estado; un fallo de uno no detiene a los
        demas (estado global `partial`). Para REANUDAR una importacion parcial, fallida o interrumpida,
        repite la misma peticion con el mismo `Idempotency-Key` y un token: solo se repiten los repos
        que no estan en `success`. Mismo key con otros repos = 409 IDEMPOTENCY_CONFLICT; token rechazado
        = 422 TOKEN_INVALID. El CODEOWNERS de GitHub se convierte y se informa (no se confirma en el repo).
      tags:
      - Importacion
      x-permission: org.admin
      x-status: new
      x-idempotent: true
      parameters:
