  /hooks/git/{projectID}:
    post:
      operationId: gitInboundWebhook
      summary: Receptor de webhooks de Forgejo/GitHub (push, pull_request, revisiones, status, workflow_run, create/delete de ramas)
      description: 'Autenticado por HMAC-SHA256 (X-Forgejo-Signature, X-Hub-Signature-256 o X-Gitea-Signature) antes de parsear. Idempotente por
        X-Forgejo-Delivery (X-Gitea-Delivery, X-GitHub-Delivery; sin cabecera, por hash del cuerpo): un delivery repetido responde 202 con
        {"status":"duplicate"} y no se vuelve a procesar. Respuestas 202: accepted (se registro y/o desplego), ignored (evento sin
        significado de producto o de otro repositorio), duplicate. Tras rotar el secreto, el anterior se acepta 24 h. 503 TEMPORARILY_UNAVAILABLE
        si el registro de eventos no esta disponible (el remitente puede reintentar). Los eventos de revision, status y ejecucion de CI tienen
        forma no confirmada contra Forgejo v15.0.11 (?).'
      tags:
      - Webhooks entrantes
      x-permission: public-signature
      x-status: implemented
      parameters:
      - $ref: '#/components/parameters/projectID'
      security:
      - webhookSignature: []
      responses:
        '202':
          description: accepted | ignored | duplicate
        '401':
          description: No autenticado (UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso (FORBIDDEN)
          content:
            application/json:
              schema:
