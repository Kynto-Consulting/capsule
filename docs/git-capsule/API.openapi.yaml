components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'JWT de sesion o token `cap_...` (user/tokens). Scopes de token existentes: deploy; nuevos propuestos: git:read, git:write,
        security:write.'
    webhookSignature:
      type: apiKey
      in: header
      name: X-Forgejo-Signature
      description: HMAC-SHA256 hex del cuerpo con el secreto del proyecto (entrante, ya implementado en gitsource/webhook.go).
  parameters:
    orgID:
      name: orgID
      in: path
      required: true
      schema: *id004
    projectID:
      name: projectID
      in: path
      required: true
      schema: *id004
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id001
            message: *id001
            details:
              type: object
              additionalProperties: true
            request_id: *id001
          required:
          - code
          - message
      required:
      - error
      description: 'Formato comun. Codigos nuevos: GIT_NOT_READY, PROTECTED_BRANCH, CHECKS_REQUIRED, REVIEWS_REQUIRED, POLICY_BLOCKED, APPROVAL_REQUIRED,
        SELF_APPROVAL_FORBIDDEN, IDEMPOTENCY_CONFLICT, UPSTREAM_GIT_ERROR, RATE_LIMITED, HEAD_CHANGED (409, el cabezal del PR cambio), DRAFT (422, el PR es borrador), PROTECTED_TAG (403, etiqueta protegida: solo git.admin la crea o borra), TRY_AGAIN (Forgejo ocupado, reintentar con Retry-After), NOT_SUPPORTED (501, capacidad que la API de Forgejo no ofrece: artefactos de runs y re-ejecutar solo los jobs fallidos), VALIDATION_ERROR (422).'
    Job:
      type: object
      properties:
        id: *id004
        status:
          type: string
          enum:
          - queued
          - running
          - success
          - failed
        detail: *id001
      required:
      - id
      - status
    Reason:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
      required:
      - reason
    GitStatus:
      type: object
      properties:
        forgejo_version: *id001
        ready: &id006
          type: boolean
        runners:
          type: object
          properties:
            online: *id005
            labels:
              type: array
              items: *id001
        features:
          type: array
          items: *id001
    GitLinkInput:
      type: object
      properties:
        provider:
          type: string
          enum:
          - github
          - forgejo
          - gitea
          - generic
        repo_url: *id001
        branch: *id001
        auth_kind:
          type: string
          enum:
          - token
          - ssh_key
          - none
        credential: *id001
        auto_deploy: *id006
        preview_enabled: *id006
        preview_max: *id005
        preview_ttl_hours: *id005
        rotate_webhook_secret: *id006
    GitLink:
      type: object
      properties:
        project_id: *id004
        provider: *id001
        repo_url: *id001
        branch: *id001
        auth_kind: *id001
        auto_deploy: *id006
        preview_enabled: *id006
        preview_max: *id005
        preview_ttl_hours: *id005
        has_credential: *id006
        webhook_url: *id001
        webhook_secret:
          type: string
          description: Solo al crear o rotar
        created_at: &id007
          type: string
          format: date-time
        updated_at: *id007
    GitTestResult:
      type: object
      properties:
        ok: *id006
        branch_found: *id006
        message: *id001
    PreviewCreate:
      type: object
      properties:
        pr: *id005
        ref: *id001
        sha: *id001
      required:
      - pr
    Preview:
      type: object
      properties:
        project_id: *id004
        parent_project_id: *id004
        slug: *id001
        pr: *id005
        status: *id001
        url: *id001
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    PreviewList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Preview'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
    Repo:
      type: object
      properties:
        provision_status:
          type: string
          enum:
          - pending
          - ready
          - failed
        last_error: *id001
        default_branch: *id001
        clone_https: *id001
        clone_ssh: *id001
        clone:
          $ref: '#/components/schemas/CloneOptions'
        forgejo_url: *id001
        size_kb: *id005
        archived: *id006
        delete_branch_on_merge: *id006
        allowed_merge_styles:
          type: array
          items:
            type: string
            enum:
            - merge
            - squash
            - rebase
            - fast-forward
    CloneOptions:
      type: object
      properties:
        capsule:
          type: object
          properties:
            command: *id001
            install_url: *id001
          description: '`capsule git clone org/repo` (usa la sesion activa del CLI)'
        https:
          type: object
          properties:
            url: *id001
            command: *id001
            gcm_config:
              type: array
              items:
                type: object
                properties:
                  key: *id001
                  value: *id001
            gcm_note: *id001
          description: Git puro; si hay Git Credential Manager, flujo de navegador via OAuth2 de Forgejo
        ssh:
          type: object
          properties:
            url: *id001
            command: *id001
    GitCredentialRequest:
      type: object
      properties:
