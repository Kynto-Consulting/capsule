  /orgs/{orgID}/projects/{projectID}/security/sarif:
    post:
      operationId: sarifUpload
      summary: Sube SARIF 2.1.0 (gzip+base64 o JSON). Token de proyecto con scope security:write
      description: 'Valida y normaliza el contenido en el acto (errores 422 con codigo estable: SARIF_INVALID, SARIF_UNSUPPORTED, SARIF_TOO_DEEP
        con anidacion > 64, SARIF_TOO_MANY_RESULTS con mas de 10000 resultados; 413 SARIF_TOO_LARGE con mas de 10 MiB comprimido o 48 MiB descomprimido)
        y encola el procesamiento (202). El SARIF original no se guarda; los textos se guardan escapados (HTML y Markdown) y el valor de un secreto
        detectado nunca se guarda ni se devuelve. Ademas de SARIF 2.1.0 el campo sarif acepta el JSON nativo de osv-scanner (--format json), que si
        trae severidad CVSS. Una subida reemplaza a la anterior de la misma herramienta y rama: lo que ya no aparece pasa a fixed. 429 RATE_LIMITED
        a partir de 30 subidas por minuto y proyecto. Quien sube necesita security.triage (deployer o admin; un token de CI actua con el rol de su
        propietario).'
      tags:
      - Seguridad
      x-permission: security.write
      x-status: new
      x-idempotent: true
      parameters:
