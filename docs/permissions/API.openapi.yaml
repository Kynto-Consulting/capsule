              source: { type: string, enum: [org, explicit, inherited] }
              via: { type: array, items: { type: object, properties: { kind: { type: string, enum: [floor, base, direct, group, repo, env] }, label: { type: string }, template: { type: string }, expires_at: { type: [string, "null"], format: date-time } } } }
              permissions_count: { type: integer }
        mode: { type: string, enum: [open, restricted] }
        next_cursor: { type: [string, "null"] }
    OrgMember:
      type: object
      properties:
        user: { $ref: "#/components/schemas/UserRef" }
