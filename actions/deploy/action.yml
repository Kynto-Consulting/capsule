name: Capsule Deploy
description: Deploy a project to Capsule with the Capsule CLI (account, project and deploy-only variables supported).
author: Kynto

branding:
  icon: upload-cloud
  color: blue

inputs:
  token:
    description: Capsule API token (cap_...). Create one with `capsule tokens create --scope deploy --project <id>`.
    required: true
  org-id:
    description: Organization ID.
    required: true
  project-id:
    description: Project ID to deploy.
    required: true
  api-url:
    description: Capsule API base URL.
    required: true
  env:
    description: |
      Deploy-only variables, one KEY=VALUE per line. They apply to this deployment only and win over
      project and account variables (precedence: deploy > project > account).
    required: false
    default: ''
  timeout:
    description: Maximum time to wait for the deployment (e.g. 10m, 30m).
    required: false
    default: 10m
  working-directory:
    description: Directory to deploy (monorepo apps). Defaults to the repository root.
    required: false
    default: '.'
  version:
    description: Version of @kyntocg/capsule-cli to install (npm version or tag).
    required: false
    default: latest
  apps-domain:
    description: Apps domain used to build the public URL when the API does not return one.
    required: false
    default: ''

outputs:
  url:
    description: Public URL of the deployed app (empty when the URL could not be determined).
    value: ${{ steps.deploy.outputs.url }}
  deployment-id:
    description: ID of the Capsule deployment.
    value: ${{ steps.deploy.outputs.deployment-id }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Capsule CLI
      shell: bash
      env:
        CAPSULE_CLI_VERSION: ${{ inputs.version }}
      run: npm install --global "@kyntocg/capsule-cli@${CAPSULE_CLI_VERSION}"

    - name: Deploy
      id: deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CAPSULE_TOKEN: ${{ inputs.token }}
        CAPSULE_ORG_ID: ${{ inputs.org-id }}
        CAPSULE_PROJECT_ID: ${{ inputs.project-id }}
        CAPSULE_API_URL: ${{ inputs.api-url }}
        CAPSULE_APPS_DOMAIN: ${{ inputs.apps-domain }}
        CAPSULE_DEPLOY_ENV: ${{ inputs.env }}
        CAPSULE_TIMEOUT: ${{ inputs.timeout }}
      run: |
        echo "::add-mask::${CAPSULE_TOKEN}"
        args=(deploy --yes --timeout "${CAPSULE_TIMEOUT}")
        if [ -n "${CAPSULE_DEPLOY_ENV//[[:space:]]/}" ]; then
          args+=(--env "${CAPSULE_DEPLOY_ENV}")
        fi
        capsule "${args[@]}"
